[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fca-register"
dynamic = ["version"]
description = "Async client and CLI for the FCA Financial Services Register API"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Alexander Wornast" }]
keywords = ["fca", "financial conduct authority", "register", "uk", "finance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
]
dependencies = ["requests>=2.25"]

[project.scripts]
fca-register = "fca_register.cli:run"

[tool.hatch.version]
path = "src/fca_register/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fca_register"]

[tool.hatch.envs.default]
dependencies = ["pytest"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
