[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fca-register"
dynamic = ["version"]
description = "Async client, CLI and MCP server for the FCA Financial Services Register API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Wornast" }]
keywords = ["fca", "financial conduct authority", "register", "uk", "finance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/tetracionist/fca-register"
Issues = "https://github.com/tetracionist/fca-register/issues"

[project.scripts]
fca-register = "fca_register.cli:run"
fca-register-mcp = "fca_register.mcp_server:run"

[tool.hatch.version]
path = "src/fca_register/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fca_register"]

[tool.hatch.envs.default]
dependencies = ["pytest"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
